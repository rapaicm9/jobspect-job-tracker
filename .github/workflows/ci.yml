name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a branch makes the in-flight run for that branch obsolete.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The three jobs below have no `needs:` between them, so they start together and
# the PR waits for the slowest rather than the sum. Deliberately no `paths:`
# filters: a workflow skipped by a path filter leaves its check pending forever
# rather than reporting success, which is what blocks a merge the day one of
# these becomes a required check.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Reads the pinned SDK band from global.json rather than restating it
          # here, so CI and a developer machine resolve the same analyzers.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        # Analyzers run as part of the build. TreatWarningsAsErrors means any
        # analyzer or compiler warning fails this step - that is the gate.
        run: dotnet build --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        # The full test pyramid: unit + integration + architecture rules, reusing
        # the Release build above. Integration tests stand up real PostgreSQL and
        # Redis through Testcontainers, which talks to the Docker daemon that
        # ubuntu-latest ships preinstalled - no extra runner setup needed. A
        # failing test fails the gate; coverage is information, never a gate.
        run: dotnet test --no-build --no-restore --configuration Release

  web-fast:
    name: web-fast
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/Jobspect.Web

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read the pinned Node version
        id: node
        # Sourced from .nvmrc so the version lives in one place and a local
        # `nvm use` cannot drift from what CI runs.
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          # pnpm's own version comes from the packageManager field.
          package-json-file: src/Jobspect.Web/package.json
          runtime: node@${{ steps.node.outputs.version }}
          cache-dependency-path: src/Jobspect.Web/pnpm-lock.yaml
          cache: true
          # This action installs at the repository root, which is not where the
          # package lives.
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        # Carries the five architectural boundary rules, so a cross-feature
        # import or a server module missing `server-only` fails here.
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check licences
        run: pnpm licences

  web-slow:
    name: web-slow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/Jobspect.Web

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read the pinned Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          package-json-file: src/Jobspect.Web/package.json
          runtime: node@${{ steps.node.outputs.version }}
          cache-dependency-path: src/Jobspect.Web/pnpm-lock.yaml
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore the Next build cache
        uses: actions/cache@v6
        with:
          path: src/Jobspect.Web/.next/cache
          key: next-${{ hashFiles('src/Jobspect.Web/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('src/Jobspect.Web/pnpm-lock.yaml') }}-

      - name: Restore the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('src/Jobspect.Web/pnpm-lock.yaml') }}

      - name: Install the Playwright browser
        # Both projects are Desktop Chrome, one light and one dark, so chromium
        # is the only download. --with-deps still runs because the apt packages
        # it installs live outside the cached directory.
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and test
        # playwright.config.ts builds and serves the standalone output itself,
        # so this one command covers the production build, the axe sweep and the
        # token contrast assertions without booting a second browser.
        run: pnpm test:e2e
